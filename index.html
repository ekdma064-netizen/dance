<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141225">
<title>동작맞추기 AR 액션 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141225; --panel:#1f1c38; --panel2:#2a2650; --line:#3a3570;
  --ink:#ffffff; --muted:#b9b4e0; --accent:#FFD93D; --pink:#FF6B9A;
  --teal:#4ECDC4; --coral:#FF6B6B; --good:#5BE37D; --bad:#FF5C7A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}
.title{font-family:"Jua",sans-serif;letter-spacing:.5px}

/* ---------- 시작 화면 ---------- */
#startScreen{flex-direction:column;align-items:center;overflow-y:auto;padding:24px 16px 40px;
  background:radial-gradient(circle at 20% 0%,#3b2d7a 0,transparent 45%),radial-gradient(circle at 90% 100%,#5a2350 0,transparent 45%),var(--bg)}
.start-wrap{width:100%;max-width:880px}
.logo{font-size:clamp(40px,7vw,64px);text-align:center;line-height:1.1;margin-top:8px}
.logo span{color:var(--accent)}
.sub{text-align:center;color:var(--muted);margin:8px 0 22px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .k{width:96px;flex-shrink:0;font-weight:700;color:var(--muted);font-size:14px}
.row input[type=text]{flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-size:17px;padding:10px 14px;border-radius:12px;outline:none;font-family:inherit}
.row input[type=text]:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;font-size:15px;font-weight:700}
.seg button.on{background:var(--accent);color:#2a2000}
.tog{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;width:100%;padding-left:108px}
@media (max-width:560px){.hint{padding-left:0}.row .k{width:auto}}
.go{display:block;width:100%;margin-top:18px;padding:18px;border-radius:18px;font-family:"Jua";font-size:28px;
  background:linear-gradient(90deg,var(--pink),var(--accent));color:#2a1030;box-shadow:0 8px 0 #8a2d55}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 #8a2d55}
.best{text-align:center;margin-top:14px;color:var(--muted);font-size:14px}
.best b{color:var(--accent)}

/* ---------- 게임 화면 ---------- */
#gameScreen{flex-direction:column}
.hud{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.hud .pill{background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.hud .pill b{color:var(--accent);font-size:18px}
.hud .sp{flex:1}
.hud button{background:var(--panel2);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:560px){.hud{gap:6px;padding:8px}.hud .pill{padding:5px 9px;font-size:13px}.hud .pill b{font-size:15px}.hud button{padding:6px 9px;font-size:13px}}
.stage{flex:1;display:grid;grid-template-columns:minmax(280px,36%) 1fr;gap:12px;padding:12px;min-height:0}
@media (orientation:portrait){ .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,42%) 1fr} }
.mission{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;min-height:0}
@media (orientation:portrait){ .mission{display:grid;grid-template-columns:44% 1fr;grid-template-rows:auto auto 1fr;column-gap:12px}
  .mission .fig{grid-column:1;grid-row:1/4} .mission .tag,.mission .song,.mission .info{grid-column:2} }
.mission .song{text-align:center;margin-top:4px}
@media (orientation:portrait){ .mission .song{text-align:left} }
.mission .artist{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
.mission .tag{font-size:13px;color:var(--muted);font-weight:700}
.mission h2{font-family:"Jua";font-size:clamp(26px,3.4vw,38px);color:var(--accent);line-height:1.15}
.mission .fig{flex:1;min-height:0;position:relative}
.mission .fig canvas,.mission .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mission .fig img{display:none;border-radius:16px}
.mission .fig.has-img img{display:block}
.mission .fig.has-img canvas{display:none}
.mission .desc{display:none} /* 동작 설명 문구 숨김 */
.mission .mir{font-size:12px;color:var(--teal);font-weight:700}
.pass{display:block;width:100%;margin-top:12px;padding:12px;border-radius:14px;font-family:"Jua";font-size:22px;background:var(--panel2);color:var(--ink);border:2px solid var(--line)}
.pass:active{transform:translateY(2px)}
.pass:disabled{opacity:.35}
.bars{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.bar{height:16px;background:var(--panel2);border-radius:999px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .08s linear}
.bar .thr{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px;opacity:.85}
.blabel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:3px}
.blabel b{color:var(--ink);font-size:15px}
.cam{position:relative;background:#000;border-radius:20px;overflow:hidden;min-height:0;border:1px solid var(--line)}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;padding:20px}
.overlay .big{font-family:"Jua";font-size:clamp(60px,12vw,140px);color:var(--accent);text-shadow:0 6px 0 rgba(0,0,0,.4)}
.overlay .msg{font-family:"Jua";font-size:clamp(20px,3vw,30px);background:rgba(20,18,37,.78);padding:12px 22px;border-radius:16px;line-height:1.4}
.overlay .msg small{display:block;font-family:"Noto Sans KR";font-size:14px;color:var(--muted);margin-top:4px}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
  font-family:"Jua";text-align:center;transition:all .25s cubic-bezier(.3,1.6,.6,1)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .g{font-size:clamp(48px,9vw,96px);text-shadow:0 6px 0 rgba(0,0,0,.45)}
.toast .p{font-size:clamp(24px,4vw,40px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.spinner{width:56px;height:56px;border:6px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 결과 화면 ---------- */
#resultScreen{align-items:center;justify-content:center;padding:16px;overflow-y:auto;
  background:radial-gradient(circle at 50% 0%,#4a2d7a 0,transparent 55%),var(--bg)}
.res{width:100%;max-width:560px;text-align:center}
.res .who{color:var(--muted);font-weight:700}
.res .total{font-family:"Jua";font-size:clamp(64px,14vw,110px);color:var(--accent);line-height:1}
.res .newbest{display:inline-block;background:var(--pink);color:#2a1030;font-weight:900;border-radius:999px;padding:4px 14px;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.stats b{display:block;font-family:"Jua";font-size:28px}
.stats span{font-size:13px;color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 14px;text-align:left;max-height:34vh;overflow-y:auto}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.list .it:last-child{border-bottom:0}
.list .it em{font-style:normal;font-weight:900}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:15px;border-radius:16px;font-family:"Jua";font-size:22px}
.btns .a{background:var(--accent);color:#2a2000}
.btns .b{background:var(--panel2);color:var(--ink)}
</style>
</head>
<body>

<!-- ================= 시작 화면 ================= -->
<section id="startScreen" class="screen on">
  <div class="start-wrap">
    <h1 class="logo title">동작맞추기<br><span>AR 액션 게임</span></h1>
    <p class="sub">화면 속 캐릭터 동작을 따라 하면 카메라가 인식해서 점수를 줘요!</p>
    <div class="card">
      <div class="row"><label class="k" for="nick">닉네임</label>
        <input id="nick" type="text" maxlength="12" placeholder="이름을 입력하세요"></div>
      <div class="row"><span class="k">인식 범위</span>
        <div class="seg" data-key="body"><button data-v="full" class="on">전신</button><button data-v="upper">상반신만</button></div>
        <p class="hint">전신: 2~3m 떨어져 서서 발끝까지 보이게 · 상반신: 좁은 교실/책상 위 태블릿용</p></div>
      <div class="row"><span class="k">옵션</span>
        <label class="tog"><input id="optGhost" type="checkbox" checked> 내 몸 위에 가이드 표시</label>
        <label class="tog"><input id="optMirror" type="checkbox" checked> 좌우 반대로 해도 인정</label></div>
    </div>
    <button class="go" id="btnStart">게임 시작!</button>
    <p class="best" id="bestLine"></p>
  </div>
</section>

<!-- ================= 게임 화면 ================= -->
<section id="gameScreen" class="screen">
  <div class="hud">
    <div class="pill">미션 <b id="hRound">0</b> / <span id="hTotal">0</span></div>
    <div class="pill">점수 <b id="hScore">0</b></div>
    <div class="pill">콤보 <b id="hCombo">0</b></div>
    <div class="sp"></div>
    <button id="btnPause">일시정지</button>
    <button id="btnQuit">그만하기</button>
  </div>
  <div class="stage">
    <div class="mission">
      <div class="tag" id="mTag">MISSION</div>
      <div class="fig"><img id="figImg" alt=""><canvas id="figCanvas"></canvas></div>
      <div class="song"><h2 id="mName">준비 중</h2><div class="artist" id="mArtist"></div></div>
      <div class="info">
        <p class="desc" id="mDesc">카메라를 준비하고 있어요.</p>
        <p class="mir" id="mMir"></p>
        <div class="bars">
          <div><div class="blabel"><span>일치도</span><b id="mPct">0%</b></div>
            <div class="bar"><i id="barMatch" style="width:0;background:var(--teal)"></i><span class="thr" id="thr"></span></div></div>
          <div><div class="blabel"><span>자세 유지</span><span id="mTime">걸린 시간 -</span></div>
            <div class="bar"><i id="barHold" style="width:0;background:var(--accent)"></i></div></div>
        </div>
        <button class="pass" id="btnPass">패스 ▶</button>
      </div>
    </div>
    <div class="cam">
      <canvas id="camCanvas"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="toast" id="toast"><div class="g" id="tG"></div><div class="p" id="tP"></div></div>
    </div>
  </div>
  <video id="video" playsinline muted autoplay style="display:none"></video>
</section>

<!-- ================= 결과 화면 ================= -->
<section id="resultScreen" class="screen">
  <div class="res">
    <div class="who" id="rWho"></div>
    <div class="total" id="rTotal">0</div>
    <div id="rBest"></div>
    <div class="stats">
      <div><b id="rClear">0/0</b><span>성공한 미션</span></div>
      <div><b id="rCombo">0</b><span>최대 콤보</span></div>
      <div><b id="rAcc">0%</b><span>평균 정확도</span></div>
    </div>
    <div class="list" id="rList"></div>
    <div class="btns"><button class="a" id="btnAgain">다시 하기</button><button class="b" id="btnHome">처음으로</button></div>
  </div>
</section>

<script type="module">
// ==LOGIC START==
/* 동작 템플릿: 참고 사진은 사용하지 않고, 사진 속 관절 위치(모션)만 좌표로 옮겨 재구성.
   좌표계: 거울 모드 화면 기준 (x: 0=왼쪽, 1=오른쪽 / y: 0=위, 1=아래). l = 화면 왼쪽 팔·다리 */
const JOINTS = ['nose','lShoulder','rShoulder','lElbow','rElbow','lWrist','rWrist','lHip','rHip','lKnee','rKnee','lAnkle','rAnkle'];
const LM_INDEX = {nose:0,lShoulder:11,rShoulder:12,lElbow:13,rElbow:14,lWrist:15,rWrist:16,lHip:23,rHip:24,lKnee:25,rKnee:26,lAnkle:27,rAnkle:28};
const BASE = {nose:[.5,.13], lShoulder:[.42,.25], rShoulder:[.58,.25], lHip:[.45,.52], rHip:[.55,.52]};
const SEGMENTS = [ // [키, 시작관절, 끝관절, 가중치, 종류]
  ['lUpper','lShoulder','lElbow',1,'arm'], ['lFore','lElbow','lWrist',1,'arm'],
  ['rUpper','rShoulder','rElbow',1,'arm'], ['rFore','rElbow','rWrist',1,'arm'],
  ['lThigh','lHip','lKnee',.8,'leg'], ['lShin','lKnee','lAnkle',.8,'leg'],
  ['rThigh','rHip','rKnee',.8,'leg'], ['rShin','rKnee','rAnkle',.8,'leg'],
];
function toPts(obj){ const o={}; for(const k in obj) o[k]={x:obj[k][0],y:obj[k][1],v:1}; return o; }
function mirrorPts(p){ const o={}; for(const k in p){ const nk = k[0]==='l'?'r'+k.slice(1):k[0]==='r'?'l'+k.slice(1):k; o[nk]={x:1-p[k].x,y:p[k].y,v:p[k].v}; } return o; }
function mk(id,name,artist,desc,parts){ const pts=toPts({...BASE,...parts}); return {id,name,artist,desc,pts,mirror:mirrorPts(pts)}; }

const VIS = 0.5;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
function angDiff(a,b){ let d=Math.abs(a-b)%(Math.PI*2); if(d>Math.PI) d=Math.PI*2-d; return d*180/Math.PI; }

function scorePose(user,target,opt){
  let sum=0,wsum=0; const per={};
  for(const [key,a,b,w,kind] of SEGMENTS){
    if(kind==='leg' && !opt.useLegs) continue;
    const ua=user[a], ub=user[b]; let sim=0;
    if(ua&&ub&&ua.v>=VIS&&ub.v>=VIS){
      const d=angDiff(ang(ua,ub),ang(target[a],target[b]));
      sim=clamp(1-Math.max(0,d-opt.grace)/opt.tol,0,1);
    }
    per[key]=sim; sum+=sim*w; wsum+=w;
  }
  return {score: wsum? sum/wsum*100 : 0, per};
}
function matchPose(user,pose,opt){
  const a=scorePose(user,pose.pts,opt);
  if(!opt.allowMirror) return {...a,mirrored:false};
  const b=scorePose(user,pose.mirror,opt);
  return b.score>a.score ? {...b,mirrored:true} : {...a,mirrored:false};
}

const COL={l:'#FF6B6B', r:'#4ECDC4', torso:'#FFD93D', head:'#FFE8A3', ink:'#2a1f4a'};
function drawFigure(ctx,pts,map,unit,alpha=1,ghost=false){
  const P=n=>map(pts[n]);
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineCap='round'; ctx.lineJoin='round';
  const lw=unit*0.05;
  // 몸통
  const ls=P('lShoulder'),rs=P('rShoulder'),lh=P('lHip'),rh=P('rHip'),nose=P('nose');
  ctx.fillStyle=ghost?'rgba(255,255,255,.55)':COL.torso;
  ctx.strokeStyle=ghost?'rgba(255,255,255,.9)':COL.torso; ctx.lineWidth=lw*0.9;
  ctx.beginPath(); ctx.moveTo(ls.x,ls.y); ctx.lineTo(rs.x,rs.y); ctx.lineTo(rh.x,rh.y); ctx.lineTo(lh.x,lh.y); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 팔다리
  const limb=(a,b,c,col)=>{ const A=P(a),B=P(b),C=P(c); ctx.strokeStyle=ghost?'rgba(255,255,255,.95)':col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.stroke();
    ctx.fillStyle=ghost?'#fff':col; ctx.beginPath(); ctx.arc(C.x,C.y,lw*0.75,0,Math.PI*2); ctx.fill(); };
  limb('lHip','lKnee','lAnkle',COL.l); limb('rHip','rKnee','rAnkle',COL.r);
  limb('lShoulder','lElbow','lWrist',COL.l); limb('rShoulder','rElbow','rWrist',COL.r);
  // 목·머리
  const mid={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2};
  ctx.strokeStyle=ghost?'rgba(255,255,255,.9)':COL.torso; ctx.lineWidth=lw*0.8;
  ctx.beginPath(); ctx.moveTo(mid.x,mid.y); ctx.lineTo(nose.x,nose.y); ctx.stroke();
  const hr=unit*0.075;
  ctx.fillStyle=ghost?'rgba(255,255,255,.7)':COL.head; ctx.beginPath(); ctx.arc(nose.x,nose.y,hr,0,Math.PI*2); ctx.fill();
  if(!ghost){ ctx.strokeStyle=COL.torso; ctx.lineWidth=lw*0.35; ctx.stroke();
    ctx.fillStyle=COL.ink; [-1,1].forEach(s=>{ctx.beginPath(); ctx.arc(nose.x+s*hr*0.38,nose.y-hr*0.05,hr*0.12,0,Math.PI*2); ctx.fill();});
    ctx.strokeStyle=COL.ink; ctx.lineWidth=hr*0.1; ctx.beginPath(); ctx.arc(nose.x,nose.y+hr*0.2,hr*0.28,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); }
  ctx.restore();
}
function drawFigureInBox(ctx,pose,w,h){
  ctx.clearRect(0,0,w,h);
  const s=Math.min(w,h)*0.98, ox=(w-s)/2, oy=(h-s)/2;
  // 바닥 그림자
  ctx.fillStyle='rgba(255,255,255,.07)'; ctx.beginPath(); ctx.ellipse(w/2,oy+s*0.95,s*0.3,s*0.03,0,0,Math.PI*2); ctx.fill();
  drawFigure(ctx,pose.pts,p=>({x:ox+p.x*s,y:oy+p.y*s}),s);
}
function fitCanvas(c){ const r=c.getBoundingClientRect(), d=Math.min(2,window.devicePixelRatio||1);
  const W=Math.max(1,Math.round(r.width*d)), H=Math.max(1,Math.round(r.height*d));
  if(c.width!==W||c.height!==H){ c.width=W; c.height=H; } return [W,H]; }
const figBox=fig.parentElement, figImg=$('figImg'); const imgFailed={};
figImg.addEventListener('error',()=>{ if(S.cur) imgFailed[S.cur.id]=true; figBox.classList.remove('has-img'); redrawMissionFigure(); });
function redrawMissionFigure(){
  if(!S.cur){ figBox.classList.remove('has-img'); fitCanvas(fig); fctx.clearRect(0,0,fig.width,fig.height); return; }
  const src=IMG_SRC[S.cur.id];
  if(src && !imgFailed[S.cur.id]){ if(figImg.getAttribute('src')!==src) figImg.src=src; figBox.classList.add('has-img'); return; }
  figBox.classList.remove('has-img'); const [w,h]=fitCanvas(fig); drawFigureInBox(fctx,S.cur,w,h); }

let actx=null;
function beep(freq,dur=0.12,type='sine',vol=0.18,delay=0){ if(!actx) return;
  const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02); }

const musicBuf={}; let musicNode=null, musicToken=0;
async function musicBuffer(id){
  if(musicBuf[id]) return musicBuf[id];
  const bin=atob(MUSIC_SRC[id].split(',')[1]); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return musicBuf[id]=await actx.decodeAudioData(arr.buffer);
}
function playMusic(id){
  stopMusic(); if(!actx||!MUSIC_SRC[id]) return;
  const token=musicToken;
  if(actx.state==='suspended') actx.resume();
  musicBuffer(id).then(buf=>{ if(token!==musicToken) return;
    const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const g=actx.createGain(); g.gain.value=0.9; src.connect(g).connect(actx.destination); src.start(); musicNode=src;
  }).catch(e=>console.warn('음원 재생 실패',e));
}
function stopMusic(){ musicToken++; if(musicNode){ try{ musicNode.stop(); }catch(e){} musicNode=null; } }

function setOverlay(html){ $('overlay').innerHTML=html; }
async function startCamera(){
  if(stream) return;
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('이 브라우저는 카메라를 지원하지 않아요. 크롬/사파리 최신 버전에서 HTTPS 주소로 열어 주세요.');
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
  video.srcObject=stream; await video.play();
}
async function loadModel(){
  if(landmarker) return;
  const ver='0.10.14';
  const {PoseLandmarker,FilesetResolver}=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/vision_bundle.mjs`);
  const fs=await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/wasm`);
  const base={modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'};
  const mkOpt=d=>({baseOptions:{...base,delegate:d},runningMode:'VIDEO',numPoses:1,
    minPoseDetectionConfidence:0.5,minPosePresenceConfidence:0.5,minTrackingConfidence:0.5});
  try{ landmarker=await PoseLandmarker.createFromOptions(fs,mkOpt('GPU')); }
  catch(e){ landmarker=await PoseLandmarker.createFromOptions(fs,mkOpt('CPU')); }
}
function toUserPts(lms,W,H){
  const o={};
  for(const k of JOINTS){ const l=lms[LM_INDEX[k]]; if(!l) continue;
    const inFrame=l.x>-0.05&&l.x<1.05&&l.y>-0.05&&l.y<1.05;
    o[k]={x:(1-l.x)*W, y:l.y*H, v: inFrame ? (l.visibility ?? 1) : 0}; }
  return o;
}

/* ---------------- 게임 흐름 ---------------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQueue(n){ const q=[]; while(q.length<n){ const bag=shuffle([...POSES]); if(q.length&&bag[0]===q[q.length-1]) bag.push(bag.shift()); q.push(...bag); } return q.slice(0,n); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }

$('btnStart').addEventListener('click',async()=>{
  const name=$('nick').value.trim()||'플레이어';
  try{ localStorage.setItem('poseChallengeNick',name); }catch(e){}
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx){ actx.resume?.(); Object.keys(MUSIC_SRC).forEach(id=>musicBuffer(id).catch(()=>{})); }
  try{ await navigator.wakeLock?.request('screen'); }catch(e){}
  S.name=name; show('gameScreen'); resetGame(); S.phase='loading';
  showPreview(S.queue[0],'첫 번째 미션 미리보기');
  setOverlay('<div class="spinner"></div><div class="msg">불러오는 중…<small>처음 한 번은 10초 정도 걸릴 수 있어요</small></div>');
  try{ await startCamera(); await loadModel(); }
  catch(err){ console.error(err); S.phase='error';
    const m = err?.name==='NotAllowedError' ? '카메라 권한이 거부되었어요. 주소창의 카메라 아이콘에서 허용해 주세요.' :
      err?.name==='NotFoundError' ? '카메라를 찾지 못했어요.' : (err?.message||'알 수 없는 오류');
    setOverlay(`<div class="msg">시작할 수 없어요 😢<small>${escapeHtml(m)}<br>GitHub Pages 같은 https:// 주소에서 열어야 카메라가 켜져요.<br>패스 버튼을 누르면 다음 동작을 볼 수 있어요.</small></div>`);
    startPreviewCycle(); return; }
  if(!loopStarted){ loopStarted=true; requestAnimationFrame(loop); }
  beginCheck();
});
function resetGame(){
  S.lv=LEVELS[settings.level];
  S.opt={useLegs:settings.body==='full',allowMirror:$('optMirror').checked,tol:S.lv.tol,grace:S.lv.grace};
  S.ghost=$('optGhost').checked;
  S.queue=buildQueue(settings.rounds); S.round=0; S.score=0; S.combo=0; S.maxCombo=0; S.results=[]; S.paused=false;
  $('btnPause').textContent='일시정지';
  $('hTotal').textContent=settings.rounds; updateHud();
  $('thr').style.left=S.lv.pass+'%';
}
function updateHud(){ $('hRound').textContent=Math.min(S.round,settings.rounds); $('hScore').textContent=S.score; $('hCombo').textContent=S.combo; }
function beginCheck(){ S.phase='check'; S.checkOk=0; showPreview(S.queue[0],'첫 번째 미션 미리보기'); }
// 미션 시작 전·카메라 오류 때도 미션 그림을 보여줌
function showPreview(pose,tag){ S.cur=pose; redrawMissionFigure();
  $('mTag').textContent=tag; $('mName').textContent=pose.name; $('mArtist').textContent=pose.artist;
  $('mDesc').textContent=pose.desc; $('mMir').textContent=''; }
// 카메라가 없을 때: 동작을 하나씩 보여주고, 패스 버튼으로 다음 동작
let previewIdx=0;
function previewStep(){ const n=S.queue.length; const p=S.queue[previewIdx%n]; playMusic(p.id); showPreview(p,`동작 미리보기 ${previewIdx%n+1} / ${n}`); }
function startPreviewCycle(){ previewIdx=0; previewStep(); }
function stopPreviewCycle(){}
function required(){ return settings.body==='full' ? JOINTS : ['nose','lShoulder','rShoulder','lElbow','rElbow','lWrist','rWrist']; }
function allVisible(u){ return !!u && required().every(k=>u[k]&&u[k].v>=0.6); }

function startMission(){
  S.round++;
  if(S.round>settings.rounds){ finish(); return; }
  S.cur=S.queue[S.round-1]; S.phase='mission'; S.missionStart=performance.now();
  S.hold=0; S.accSum=0; S.accT=0; S.best=0; S.smooth=0; S.match=null;
  $('mTag').textContent=`MISSION ${S.round}`; $('mName').textContent=S.cur.name; $('mArtist').textContent=S.cur.artist; $('mDesc').textContent=S.cur.desc;
  $('mMir').textContent= S.opt.allowMirror ? '↔ 좌우 반대로 해도 OK' : '↔ 화면과 같은 쪽 팔다리로 따라 하기';
  setOverlay(''); redrawMissionFigure(); updateHud(); sfx.go(); playMusic(S.cur.id);
}
function success(elapsed){
  stopMusic();
  const acc=S.accT? S.accSum/S.accT : S.smooth;
  S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
  const mult=1+0.1*Math.min(S.combo-1,5);
  const pts=Math.round((100+acc+Math.max(0,10-elapsed)*10)*mult);
  S.score+=pts;
  const grade= acc>=92?['PERFECT!','#FFD93D']: acc>=84?['GREAT!','#5BE37D']:['GOOD!','#4ECDC4'];
  S.results.push({name:`${S.cur.name} - ${S.cur.artist}`,ok:true,acc:Math.round(acc),pts,grade:grade[0]});
  toast(grade[0],grade[1],`+${pts}${S.combo>1?`  (${S.combo}콤보)`:''}`); sfx.ok();
  S.phase='feedback'; S.phaseUntil=performance.now()+1400; updateHud();
}
function pass(){
  stopMusic();
  S.combo=0; S.results.push({name:`${S.cur.name} - ${S.cur.artist}`,ok:false,acc:Math.round(S.best),pts:0,grade:'PASS'});
  toast('패스!','#B9B4E0','다음 동작으로 넘어가요'); sfx.fail();
  S.phase='feedback'; S.phaseUntil=performance.now()+900; updateHud();
}
$('btnPass').addEventListener('click',()=>{
  if(S.phase==='mission' && !S.paused) pass();
  else if(S.phase==='error'){ previewIdx++; previewStep(); }
});
let toastTimer=0;
function toast(g,color,p){ const t=$('toast'); $('tG').textContent=g; $('tG').style.color=color; $('tP').textContent=p;
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1150); }

function finish(){
  stopMusic();
  S.phase='result'; S.cur=null;
  const clear=S.results.filter(r=>r.ok).length, n=S.results.length;
  const avg=n? Math.round(S.results.reduce((a,r)=>a+r.acc,0)/n) : 0;
  $('rWho').textContent=`${S.name} 님의 결과 · ${settings.body==='full'?'전신':'상반신'}`;
  $('rTotal').textContent=S.score; $('rClear').textContent=`${clear}/${n}`; $('rCombo').textContent=S.maxCombo; $('rAcc').textContent=avg+'%';
  const best=loadBest();
  if(!best||S.score>best.score){ saveBest({score:S.score,name:S.name}); $('rBest').innerHTML= S.score>0?'<span class="newbest">🎉 이 기기 최고 기록!</span>':''; }
  else $('rBest').innerHTML=`<span style="color:var(--muted);font-size:14px">이 기기 최고 기록 ${best.score}점</span>`;
  $('rList').innerHTML=S.results.map((r,i)=>`<div class="it"><span>${i+1}. ${escapeHtml(r.name)}</span>
    <span>${r.acc}% · <em style="color:${r.ok?'var(--good)':'var(--bad)'}">${r.grade}</em> ${r.ok?'+'+r.pts:''}</span></div>`).join('');
  show('resultScreen');
}
$('btnAgain').addEventListener('click',()=>{ show('gameScreen'); resetGame(); beginCheck(); requestAnimationFrame(redrawMissionFigure); });
$('btnHome').addEventListener('click',()=>{ stopPreviewCycle(); stopMusic(); S.phase='idle'; showBest(); show('startScreen'); });
$('btnQuit').addEventListener('click',()=>{ stopPreviewCycle(); stopMusic(); if(S.phase==='mission'||S.phase==='feedback'||S.phase==='countdown'||S.phase==='check'){ if(S.results.length) finish(); else { S.phase='idle'; showBest(); show('startScreen'); } }
  else { S.phase='idle'; showBest(); show('startScreen'); } });
$('btnPause').addEventListener('click',()=>{ if(S.phase!=='mission') return; S.paused=!S.paused;
  $('btnPause').textContent=S.paused?'계속하기':'일시정지';
  if(S.paused) stopMusic(); else playMusic(S.cur.id);
  setOverlay(S.paused?'<div class="msg">일시정지<small>계속하기를 누르면 이어서 진행돼요</small></div>':''); });

/* ---------------- 메인 루프 ---------------- */
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,((now-S.lastT)/1000)||0); S.lastT=now;
  if(!video.videoWidth || !document.getElementById('gameScreen').classList.contains('on')) return;
  const W=video.videoWidth, H=video.videoHeight;
  if(cam.width!==W||cam.height!==H){ cam.width=W; cam.height=H; }
  cctx.save(); cctx.translate(W,0); cctx.scale(-1,1); cctx.drawImage(video,0,0,W,H); cctx.restore();
  if(landmarker && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    let ts=performance.now(); if(ts<=lastTs) ts=lastTs+1; lastTs=ts;
    try{ const res=landmarker.detectForVideo(video,ts); S.user= res.landmarks&&res.landmarks[0] ? toUserPts(res.landmarks[0],W,H) : null; }
    catch(e){ console.warn(e); }
  }
  update(dt,now);
  render(W,H);
}
function update(dt,now){
  const u=S.user;
  if(S.phase==='check'){
    S.checkOk = allVisible(u) ? S.checkOk+dt : 0;
    const p=Math.min(100,Math.round(S.checkOk/1.2*100));
    setOverlay(S.checkOk>0
      ? `<div class="msg">좋아요! 그대로 있어요 ${p}%</div>`
      : `<div class="msg">${settings.body==='full'?'머리부터 발끝까지':'어깨부터 손끝까지'} 보이게 서 주세요<small>${u?'몸 일부가 화면 밖에 있어요':'사람을 찾는 중…'}</small></div>`);
    if(S.checkOk>=1.2){ S.phase='countdown'; S.cdStart=now; S.cdLast=-1; }
  } else if(S.phase==='countdown'){
    const n=3-Math.floor((now-S.cdStart)/1000);
    if(n!==S.cdLast){ S.cdLast=n; if(n>0){ setOverlay(`<div class="big">${n}</div>`); sfx.tick(); } }
    if(now-S.cdStart>=3000) startMission();
  } else if(S.phase==='mission'){
    if(S.paused){ S.missionStart+=dt*1000; return; }
    const elapsed=(now-S.missionStart)/1000;
    if(u){ S.match=matchPose(u,S.cur,S.opt); S.smooth=S.smooth*0.6+S.match.score*0.4; }
    else { S.match=null; S.smooth*=0.9; }
    S.best=Math.max(S.best,S.smooth);
    if(S.smooth>=S.lv.pass){ S.hold+=dt; S.accSum+=S.smooth*dt; S.accT+=dt; }
    else S.hold=Math.max(0,S.hold-dt*1.5);
    const m=Math.round(S.smooth);
    $('mPct').textContent=m+'%'; const bm=$('barMatch'); bm.style.width=m+'%';
    bm.style.background= m>=S.lv.pass ? 'var(--good)' : m>=S.lv.pass-15 ? 'var(--accent)' : 'var(--coral)';
    $('barHold').style.width=Math.min(100,S.hold/S.lv.hold*100)+'%';
    $('mTime').textContent=`걸린 시간 ${elapsed.toFixed(1)}초`;
    if(S.hold>=S.lv.hold) success(elapsed);   // 성공해야 다음 동작으로 (시간 제한 없음)
  } else if(S.phase==='feedback'){
    if(now>=S.phaseUntil) startMission();
  }
}
function render(W,H){
  const u=S.user; if(!u) return;
  const unit=Math.min(W,H);
  // 가이드 고스트: 어깨 위치·너비에 맞춰 목표 동작을 내 몸 위에 겹쳐 표시
  if(S.phase==='mission' && S.ghost && S.cur && u.lShoulder?.v>=VIS && u.rShoulder?.v>=VIS){
    const t= S.match?.mirrored ? S.cur.mirror : S.cur.pts;
    const tw=Math.hypot(t.rShoulder.x-t.lShoulder.x,t.rShoulder.y-t.lShoulder.y);
    const uw=Math.hypot(u.rShoulder.x-u.lShoulder.x,u.rShoulder.y-u.lShoulder.y);
    const k=uw/tw, tm={x:(t.lShoulder.x+t.rShoulder.x)/2,y:(t.lShoulder.y+t.rShoulder.y)/2}, um={x:(u.lShoulder.x+u.rShoulder.x)/2,y:(u.lShoulder.y+u.rShoulder.y)/2};
    drawFigure(cctx,t,p=>({x:um.x+(p.x-tm.x)*k,y:um.y+(p.y-tm.y)*k}),k,0.35,true);
  }
  // 내 뼈대: 맞은 부위는 초록, 틀린 부위는 빨강
  cctx.save(); cctx.lineCap='round';
  const lw=Math.max(4,unit*0.012);
  const line=(a,b,col)=>{ if(!(u[a]?.v>=VIS&&u[b]?.v>=VIS)) return; cctx.strokeStyle=col; cctx.lineWidth=lw;
    cctx.beginPath(); cctx.moveTo(u[a].x,u[a].y); cctx.lineTo(u[b].x,u[b].y); cctx.stroke(); };
  const gray='rgba(255,255,255,.75)';
  line('lShoulder','rShoulder',gray); line('lHip','rHip',gray); line('lShoulder','lHip',gray); line('rShoulder','rHip',gray);
  for(const [key,a,b,,kind] of SEGMENTS){
    if(kind==='leg' && settings.body!=='full'){ line(a,b,gray); continue; }
    let col=gray;
    if(S.phase==='mission' && S.match){ const s=S.match.per[key] ?? 0; col=`hsl(${Math.round(s*125)},90%,55%)`; }
    line(a,b,col);
  }
  cctx.fillStyle='#fff';
  for(const k of JOINTS){ const p=u[k]; if(p?.v>=VIS){ cctx.beginPath(); cctx.arc(p.x,p.y,lw*0.7,0,Math.PI*2); cctx.fill(); } }
  cctx.restore();
}
window.addEventListener('resize',()=>requestAnimationFrame(redrawMissionFigure));

showBest();
</script>
